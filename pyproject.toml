[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "permission-to-retry"
version = "0.1.0"
description = "Open replication of arXiv 2610.31916: authorization and recovery in AI agent workflows"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
